name: amr-demo

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: "no"
    ports:
      - "127.0.0.1:1884:1883"
    volumes:
      - type: bind
        source: ./mosquitto/config/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./mosquitto/data
        target: /mosquitto/data
        bind:
          create_host_path: true
      - type: bind
        source: ./mosquitto/log
        target: /mosquitto/log
        bind:
          create_host_path: true

  seq:
    image: datalust/seq:2026.1
    profiles: [logging]
    restart: "no"
    environment:
      ACCEPT_EULA: "Y"
      # Local development only; the HTTP port is bound to loopback below.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      - "127.0.0.1:${SEQ_HTTP_PORT:-5341}:80"
    volumes:
      - seq-data:/data

volumes:
  seq-data:
